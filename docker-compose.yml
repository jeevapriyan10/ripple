services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-backend
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./backend/ripple:/app/ripple
    command: ["sh", "-c", "exec uvicorn ripple.main:create_app --factory --host 0.0.0.0 --port ${API_PORT:-8000} --reload"]
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ripple-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/src:/app/src:ro
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
